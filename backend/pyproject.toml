[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2"]
# onnxruntime 1.31 and ctranslate2 4.8 crash (access violation) on the developer machine; these versions work.
free = ["google-genai", "faster-whisper", "piper-tts", "onnxruntime==1.20.1", "ctranslate2==4.6.0"]
paid = ["anthropic", "openai"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
