    prompt: "If I ___ a morning person, I wouldn't have missed the 6 a.m. flight."
    prompt_pt: "Se eu fosse uma pessoa matinal, não teria perdido o voo das 6 da manhã."
    options: [were, had, am]
    answers: [were, was]
    explanation: "Traço de personalidade presente → if + past simple (were), resultado passado com wouldn't have."
  - id: e11
    block: 2
