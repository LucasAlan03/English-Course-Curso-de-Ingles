  - id: e12
    block: 2
    type: choice
    prompt: "If Carla didn't trust everyone, she ___ her password to that stranger yesterday."
    prompt_pt: "Se a Carla não confiasse em todo mundo, não teria dado a senha para aquele desconhecido ontem."
    glossary: {stranger: desconhecido}
    options: [wouldn't have given, wouldn't give, didn't give]
    answers: [wouldn't have given, would not have given]
    explanation: "Traço presente (trusts everyone) com resultado passado (yesterday) → wouldn't have given."
  - id: e13
    block: 2
