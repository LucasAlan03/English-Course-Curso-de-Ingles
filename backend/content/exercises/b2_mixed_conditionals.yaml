    answers: ["If I had studied medicine, I would be a doctor now."]
    explanation: "If + past perfect (passado), would + verbo + now (presente)."
  - id: e17
    block: 2
    type: order
    prompt: "Put the words in order (present → past)."
    prompt_pt: "Coloque as palavras em ordem (presente → passado)."
