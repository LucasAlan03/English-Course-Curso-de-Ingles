  - id: e15
    block: 2
    type: fix
    prompt: "If she wasn't so busy, she would come to your birthday party last Saturday."
    prompt_pt: "Se ela não fosse tão ocupada, teria vindo à sua festa de aniversário no sábado passado."
    answers:
      - "If she wasn't so busy, she would have come to your birthday party last Saturday."
      - "If she wasn't so busy, she'd have come to your birthday party last Saturday."
      - "If she weren't so busy, she would have come to your birthday party last Saturday."
