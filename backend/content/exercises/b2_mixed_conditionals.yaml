module_id: b2_mixed_conditionals
exercises:
  - id: e01
    block: 1
    type: choice
    prompt: "If I had accepted that job in Dublin, I ___ in Ireland now."
    prompt_pt: "Se eu tivesse aceitado aquele emprego em Dublin, eu moraria na Irlanda agora."
    options: [would live, would have lived, will live]
    answers: [would live]
    explanation: "Condição passada com resultado no presente (now) → would + verbo."
  - id: e02
    block: 1
    type: choice
    prompt: "If she weren't so shy, she ___ to him at the party last night."
    prompt_pt: "Se ela não fosse tão tímida, teria falado com ele na festa ontem à noite."
    options: [would have talked, would talk, talks]
    answers: [would have talked]
    explanation: "Característica presente (weren't so shy) com resultado passado (last night) → would have + particípio."
  - id: e03
    block: 1
    type: choice
    prompt: "If we had bought that apartment in 2015, it ___ worth twice as much today."
    prompt_pt: "Se tivéssemos comprado aquele apartamento em 2015, hoje ele valeria o dobro."
    options: [would be, would have been, is]
    answers: [would be]
    explanation: "Today indica resultado presente → would be."
  - id: e04
    block: 1
    type: choice
    prompt: "If I ___ allergic to cats, I would have adopted the kitten we found yesterday."
    prompt_pt: "Se eu não fosse alérgico a gatos, teria adotado o filhote que encontramos ontem."
    glossary: {kitten: filhote de gato}
    options: [weren't, won't be, am not]
    answers: [weren't, wasn't]
    explanation: "A alergia é uma condição presente e permanente → past simple irreal (weren't)."
  - id: e05
    block: 1
    type: choice
    prompt: "Which sentence links a PAST event to a PRESENT result?"
    prompt_pt: "Qual frase liga um acontecimento PASSADO a um resultado PRESENTE?"
    options: ["If I had slept more, I wouldn't be so tired now.", "If I had slept more, I wouldn't have been tired.", "If I slept more, I wouldn't be tired."]
    answers: ["If I had slept more, I wouldn't be so tired now."]
    explanation: "Had slept (passado) + wouldn't be ... now (presente) é o condicional misto."
  - id: e06
    block: 1
    type: listen
    audio_text: "If Bruno hadn't broken his leg last month, he would be playing in tonight's game."
    prompt: "Is Bruno playing tonight?"
    prompt_pt: "O Bruno vai jogar hoje à noite?"
    options: ["No, he isn't.", "Yes, he is.", "Yes, but only for a few minutes."]
    answers: ["No, he isn't."]
    explanation: "Would be playing descreve o presente imaginário: na realidade, ele não vai jogar."
  - id: e07
    block: 1
    type: listen
    audio_text: "If I spoke French, I would have understood what the tour guide was saying yesterday."
    prompt: "Does the speaker speak French?"
    prompt_pt: "A pessoa que fala fala francês?"
    options: ["No.", "Yes.", "Yes, fluently."]
    answers: ["No."]
    explanation: "If I spoke French é presente irreal: a pessoa não fala francês."
  - id: e08
    block: 1
    type: gap
    prompt: "If I had saved more money, I ___ (be) on holiday right now."
    prompt_pt: "Se eu tivesse economizado mais dinheiro, estaria de férias agora mesmo."
    answers: [would be, could be, might be]
    explanation: "Right now indica resultado presente → would be."
  - id: e09
    block: 1
    type: gap
    prompt: "If you had listened to my advice, you ___ (not / be) in this mess now."
    prompt_pt: "Se você tivesse ouvido meu conselho, não estaria nessa confusão agora."
    glossary: {mess: confusão}
    answers: [wouldn't be, would not be]
    explanation: "Conselho ignorado no passado, problema no presente (now) → wouldn't be."
  - id: e10
