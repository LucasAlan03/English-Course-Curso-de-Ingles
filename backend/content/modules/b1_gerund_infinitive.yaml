id: b1_gerund_infinitive
level: B1
title: Gerúndio × infinitivo
order: 8
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Gerúndio (-ing) × infinitivo (to)

  - Depois de **enjoy, avoid, finish, mind, suggest** vem -ing: *I enjoy cooking.*

  - Depois de **want, decide, hope, plan, need** vem to + verbo: *I want to travel.*

  - Depois de preposição vem -ing: *She is good at singing.*

  - **like, love, hate, start** aceitam os dois: *I like swimming / to swim.*

  - **stop**: *stop smoking* (parar o hábito) × *stop to rest* (parar para descansar).

  - **Erro comum:** *I enjoy to read.* O correto é *I enjoy reading.*

  '
scenario:
  title: Talking about hobbies and plans with a new neighbour
  character: A friendly neighbour
  goal: Talk about what you enjoy, want and plan to do
target_structures:
- verb + -ing
- verb + to
- preposition + -ing
