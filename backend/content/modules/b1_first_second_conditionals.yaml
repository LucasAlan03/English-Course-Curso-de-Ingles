id: b1_first_second_conditionals
level: B1
title: 1º e 2º condicionais
order: 4
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# 1º e 2º condicionais

  - **1º condicional** (possível, real): *If + presente, will + verbo.* → *If it rains, I''ll stay home.*

  - **2º condicional** (improvável, imaginário): *If + passado, would + verbo.* → *If I had more time, I would learn piano.*

  - Não use will/would logo depois do if: *If I **have** time* (não *will have*).

  - Em *if I were you*, usa-se **were** para todas as pessoas: *If I were you, I''d call her.*

  - **Erro comum:** *If I will see him, I tell him.* O certo é *If I see him, I''ll tell him.*

  '
scenario:
  title: Asking a friend for advice about a decision
  character: A friend who loves giving advice
  goal: Talk about real possibilities and imaginary situations
target_structures:
- first conditional
- second conditional
- if I were you
