id: b1_relative_clauses
level: B1
title: Relative clauses
order: 19
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Relative clauses

  - Servem para **identificar** de quem ou do que você está falando, logo depois do substantivo.

  - **who / that** para pessoas: *The man **who** lives next door is a doctor.*

  - **which / that** para coisas: *The book **which** I bought is great.*

  - **where** para lugares: *That''s the café **where** we met.*

  - **whose** para posse: *She''s the girl **whose** brother is famous.*

  - Se o pronome é **objeto**, pode omitir: *The movie (that) I saw was funny.* Se é **sujeito**, não: *The woman who called you is here.*

  - **Erro comum:** repetir o sujeito ou o objeto: *The man who he lives...* ou *The book that I bought it...*

  '
scenario:
  title: Describing a person or place a friend wants to find
  character: A friend looking for someone in a photo
  goal: Describe people, things and places in detail
target_structures:
- who
- which / that
- where
