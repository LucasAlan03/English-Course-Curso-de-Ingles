id: b2_wish_if_only
level: B2
title: Wish / if only
order: 8
source: CEFR B2 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Wish e if only

  - **Presente irreal**: wish + past simple → *I wish I had more free time.* / *If only I knew the answer.*

  - **Arrependimento do passado**: wish + past perfect → *I wish I had studied harder.*

  - **Queixa ou mudança desejada**: wish + would → *I wish you would listen to me.*

  - Com I / he / she, o formal usa **were**: *I wish I were taller.*

  - **Erro comum:** *I wish I have more time.* → *I wish I had more time.*

  '
scenario:
  title: Venting about a stressful week to a friend
  character: A good listener
  goal: Express regrets and wishes about your situation
target_structures:
- wish + past simple
- wish + past perfect
- wish + would
- if only
