id: c1_cleft_sentences
level: C1
title: Cleft sentences
order: 2
source: CEFR C1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Cleft sentences (frases clivadas)

  Servem para dar ênfase a uma parte da frase:

  - **It was** Ana **who / that** solved the problem. (destaca quem)

  - **What I need is** a break. / **What surprised me was** the price. (destaca o quê)

  - **The reason why** I left **is that** ... / **All I want is** some peace.

  - **The thing that** annoys me **is** the noise.

  - **Erro comum:** esquecer o verbo to be no meio: *What I need a break* → *What I need is a break.*

  '
scenario:
  title: Giving feedback on a project
  character: A project manager
  goal: Emphasize what worked, what surprised you and what you need
target_structures:
- It was ... who
- What I need is
- All I want is
- The reason why
