id: c1_inversion
level: C1
title: Inversion
order: 1
source: CEFR C1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Inversion (ênfase)

  Em inglês formal ou enfático, o auxiliar vem antes do sujeito depois de expressões negativas ou restritivas:

  - **Never have I** seen such a view.

  - **Not only did she** win, **but she also** broke the record.

  - **Hardly had we** arrived **when** it started to rain.

  - **Rarely do they** complain. / **Only then did I** understand.

  - **Had I known**, I would have come. (condicional sem *if*)

  - **Erro comum:** não inverter: *Never I have seen...* → *Never have I seen...*

  '
scenario:
  title: Giving a short speech at a work award ceremony
  character: A master of ceremonies
  goal: Speak with emphasis about achievements and surprises
target_structures:
- Never have I
- Not only ... but also
- Hardly ... when
- Had I known
