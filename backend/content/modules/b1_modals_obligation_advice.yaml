id: b1_modals_obligation_advice
level: B1
title: Modais de obrigação e conselho
order: 5
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Modais de obrigação e conselho

  - **must / have to**: obrigação. *You must wear a seatbelt.* / *I have to work tomorrow.*

  - **mustn''t**: proibido. *You mustn''t smoke here.* — **don''t have to**: não é necessário. *You don''t have to come.*

  - **should / ought to**: conselho. *You should see a doctor.*

  - Depois de modal vem o verbo sem *to*: *You should go* (não *should to go*).

  - **Erro comum:** confundir *mustn''t* (proibido) com *don''t have to* (não precisa).

  '
scenario:
  title: Visiting a doctor with a small health problem
  character: A helpful doctor
  goal: Describe your symptoms and understand the advice and rules you must follow
target_structures:
- should
- must / have to
- don't have to
- mustn't
