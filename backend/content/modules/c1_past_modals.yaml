id: c1_past_modals
level: C1
title: Modais no passado
order: 3
source: CEFR C1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Modais no passado

  - **should have + particípio**: crítica ou arrependimento — *You should have called me.*

  - **shouldn''t have**: *I shouldn''t have said that.*

  - **could have**: possibilidade que não aconteceu — *We could have won.*

  - **would have**: resultado hipotético — *I would have helped.*

  - **needn''t have**: fez algo desnecessário — *You needn''t have brought wine.*

  - **might have** (talvez tenha): *He might have forgotten.*

  - **Erro comum:** escrever *should of* (soa igual, mas está errado). Escreva **should have**.

  '
scenario:
  title: Reviewing a project that went badly
  character: A reflective team lead
  goal: Discuss what should, could or needn't have been done differently
target_structures:
- should have + participle
- could have
- needn't have
- might have
