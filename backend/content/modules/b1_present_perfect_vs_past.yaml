id: b1_present_perfect_vs_past
level: B1
title: Present perfect × past simple
order: 2
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Present perfect × past simple

  - **Past simple**: momento terminado e definido no passado: *I **visited** Paris in 2019.*

  - **Present perfect** (have/has + particípio): experiência ou resultado que importa agora, sem dizer quando: *I **have visited** Paris.*

  - Com **ever, never, already, yet, just** use present perfect: *Have you ever tried sushi? — Not yet.*

  - Com *yesterday, last year, in 2019, ago* use past simple.

  - **Erro comum:** *I have seen him yesterday.* Com "yesterday" o certo é *I saw him yesterday.*

  '
scenario:
  title: Getting to know a new colleague
  character: A friendly new coworker
  goal: Talk about experiences you have and haven't had, and when some of them happened
target_structures:
- present perfect
- ever / never / yet
- past simple with time words
