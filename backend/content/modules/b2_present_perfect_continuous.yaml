id: b2_present_perfect_continuous
level: B2
title: Present perfect continuous
order: 1
source: CEFR B2 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Present perfect continuous

  - Forma: **have / has been + verbo-ing**.

  - Ação que começou no passado e continua: *I''ve been studying English for two years.*

  - Ação recente com resultado visível: *Why are you wet? — I''ve been running.*

  - Com **for** (duração) e **since** (ponto de partida): *for three hours, since 9 o''clock*.

  - *I''ve been reading this book* (em andamento) × *I''ve read this book* (terminei).

  - **Erro comum:** *I am studying since Monday.* O certo é *I''ve been studying since Monday.*

  '
scenario:
  title: A job interview at an international company
  character: An interviewer
  goal: Explain how long you have been doing things and what you have been working on lately
target_structures:
- present perfect continuous
- for / since
- present perfect
