id: b1_past_simple_continuous
level: B1
title: Past simple × past continuous
order: 1
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Past simple × past continuous

  - **Past simple** conta algo que aconteceu e terminou: *I **watched** a movie last night.*

  - **Past continuous** (was/were + -ing) mostra algo em andamento no passado: *I **was watching** TV when she called.*

  - Use os dois juntos: ação longa (continuous) interrompida por ação curta (simple): *She **was cooking** when the lights **went** out.*

  - Verbos irregulares mudam: go → **went**, see → **saw**, buy → **bought**.

  - **Erro comum:** dizer *I was go* ou *I goed*. O correto é *I was going* / *I went*.

  '
scenario:
  title: Telling a friend about your weekend
  character: A curious friend
  goal: Describe what you did and what was happening during an interesting moment
target_structures:
- past simple
- past continuous
- when / while
