id: b1_futures
level: B1
title: Futuros (will / going to / present continuous)
order: 3
source: CEFR B1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Futuros: will, going to e presente contínuo

  - **will**: decisão na hora, promessa ou previsão: *I''ll have the soup.* / *It will rain tomorrow.*

  - **going to**: plano já decidido ou algo que vai acontecer pelos sinais: *I''m going to study tonight.* / *Look at those clouds! It''s going to rain.*

  - **Presente contínuo**: compromisso marcado: *I''m meeting Ana at 8.*

  - **Erro comum:** usar *will* para planos já combinados. Prefira *I''m going to travel* ou *I''m traveling next week*.

  '
scenario:
  title: Planning a trip with a friend
  character: A friend planning a holiday with you
  goal: Make plans, decisions and promises about the trip
target_structures:
- will
- going to
- present continuous for plans
