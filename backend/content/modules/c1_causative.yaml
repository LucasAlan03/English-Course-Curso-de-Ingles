id: c1_causative
level: C1
title: Causative
order: 4
source: CEFR C1 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Causative (have / get something done)

  Quando outra pessoa faz o serviço para você:

  - **have + objeto + particípio**: *I had my car repaired.* / *She''s having her hair cut.*

  - **get** é mais informal: *I need to get my phone fixed.*

  - Perguntas: *Where do you get your suits made?*

  - **have someone do**: *I had the mechanic check the brakes.*

  - **Erro comum:** *I cut my hair yesterday* (se foi o cabeleireiro) → *I had my hair cut.*

  '
scenario:
  title: Preparing a house for guests
  character: A relative helping you prepare
  goal: Explain which jobs you have arranged for others to do
target_structures:
- have something done
- get something done
- have someone do
