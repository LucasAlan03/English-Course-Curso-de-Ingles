id: b2_passive_voice
level: B2
title: Voz passiva
order: 4
source: CEFR B2 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Voz passiva

  - Forma: **to be + particípio**. O foco está em quem recebe a ação.

  - *The report was written by Ana.* / *English is spoken here.*

  - Tempos: presente *is made*, passado *was made*, perfect *has been made*, futuro *will be made*.

  - Use quando o autor não importa ou é desconhecido: *My phone was stolen.*

  - *by + agente* só quando é uma informação útil.

  - **Erro comum:** esquecer o to be: *The car repaired yesterday.* → *The car was repaired yesterday.*

  '
scenario:
  title: Reporting a problem at a hotel
  character: A hotel receptionist
  goal: Describe what was damaged, lost or not done and ask for it to be fixed
target_structures:
- passive present and past
- has / have been done
- by + agent
