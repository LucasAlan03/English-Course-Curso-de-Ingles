id: b2_reported_speech
level: B2
title: Reported speech
order: 5
source: CEFR B2 - British Council/EAQUALS Core Inventory; Cambridge English Grammar Profile
theory_md: '# Reported speech

  Para contar o que alguém disse, recue o tempo verbal:

  - present → past: *"I''m tired"* → *She said (that) she was tired.*

  - past simple → past perfect: *"I saw him"* → *He said he had seen him.*

  - will → would, can → could: *"I will call"* → *She said she would call.*

  - Mude também pronomes e marcadores: *tomorrow → the next day*, *here → there*.

  - Perguntas, sem inversão: *She asked if I was ready.*

  - **Erro comum:** *She asked me what was my name.* → *She asked me what my name was.*

  '
scenario:
  title: Passing on a message to a colleague
  character: A colleague who missed a meeting
  goal: Report what people said in a meeting and what they asked
target_structures:
- said that
- asked if / what
- backshift of tenses
